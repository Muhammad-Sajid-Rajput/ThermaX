apiVersion: apps/v1
kind: Deployment
metadata:
  name: thermax-backend
  labels:
    app: thermax-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: thermax-backend
  template:
    metadata:
      labels:
        app: thermax-backend
    spec:
      containers:
        - name: backend
          image: thermaxacr.azurecr.io/thermax-backend:latest
          ports:
            - containerPort: 5000
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: thermax-backend-service
spec:
  type: ClusterIP
  selector:
    app: thermax-backend
  ports:
    - port: 5000
      targetPort: 5000
