apiVersion: apps/v1
kind: Deployment
metadata:
  name: thermax-backend
  labels:
    app: thermax-backend
spec:
  # replicas: 1 is deliberate, not a placeholder. The backend rate limiter
  # is process-local (express-rate-limit MemoryStore — see
  # Backend/middleware/rateLimiters.js). Scaling past 1 without a shared
  # store (e.g. rate-limit-redis) would multiply every rate limit by the
  # replica count.
  replicas: 1
  selector:
    matchLabels:
      app: thermax-backend
  template:
    metadata:
      labels:
        app: thermax-backend
    spec:
      containers:
        - name: backend
          image: thermaxacr.azurecr.io/thermax-backend:latest
          ports:
            - containerPort: 5000
          env:
            - name: PORT
              value: "5000"
          envFrom:
            - secretRef:
                name: thermax-secrets
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: thermax-backend-service
spec:
  type: ClusterIP
  selector:
    app: thermax-backend
  ports:
    - port: 5000
      targetPort: 5000
