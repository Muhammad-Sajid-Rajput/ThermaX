apiVersion: v1
kind: Secret
metadata:
  name: thermax-secrets
  labels:
    app: thermax
type: Opaque
stringData:
  # Environment & Ports
  NODE_ENV: "production"
  PORT: "5000"
  
  # Database Connections
  MONGO_URI: "mongodb://thermax-mongodb:27017/thermax"
  MONGODB_URI: "mongodb://thermax-mongodb:27017/thermax"
  
  # JWT Auth & Security Secrets
  JWT_SECRET: "replace_with_strong_32_char_secret_key"
  JWT_ACCESS_SECRET: "replace_with_strong_32_char_secret_key"
  JWT_ACCESS_EXPIRES_IN: "15m"
  REFRESH_TOKEN_EXPIRES_IN: "7d"
  
  # Email Provider (Resend)
  RESEND_API_KEY: "re_your_resend_api_key_here"
  RESEND_FROM: "ThermaX <alerts@thermax.org>"
  
  # Inter-service Authentication (Backend <-> ML)
  ML_SERVICE_URL: "http://thermax-ml-service:8000"
  ML_SERVICE_KEY: "replace_with_shared_crypto_random_key"
  
  # Weather API Provider
  WEATHER_API_KEY: "your_weatherapi_key_here"
  
  # Google Earth Engine Configuration
  GEE_PROJECT_ID: "thermax-fyp"
  
  # Frontend CORS Origins
  FRONTEND_URL: "https://thermax.org"
