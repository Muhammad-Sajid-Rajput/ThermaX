apiVersion: apps/v1
kind: Deployment
metadata:
  name: thermax-frontend
  labels:
    app: thermax-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: thermax-frontend
  template:
    metadata:
      labels:
        app: thermax-frontend
    spec:
      containers:
        - name: frontend
          image: thermaxacr.azurecr.io/thermax-frontend:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: thermax-frontend-service
spec:
  type: ClusterIP
  selector:
    app: thermax-frontend
  ports:
    - port: 80
      targetPort: 80
