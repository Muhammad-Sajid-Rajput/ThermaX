apiVersion: apps/v1
kind: Deployment
metadata:
  name: thermax-ml
  labels:
    app: thermax-ml
spec:
  replicas: 2
  selector:
    matchLabels:
      app: thermax-ml
  template:
    metadata:
      labels:
        app: thermax-ml
    spec:
      containers:
        - name: ml
          image: thermaxacr.azurecr.io/thermax-ml:latest
          ports:
            - containerPort: 8000
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: thermax-ml-service
spec:
  type: ClusterIP
  selector:
    app: thermax-ml
  ports:
    - port: 8000
      targetPort: 8000
