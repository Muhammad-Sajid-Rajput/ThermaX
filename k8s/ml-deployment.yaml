apiVersion: apps/v1
kind: Deployment
metadata:
  name: thermax-ml
  labels:
    app: thermax-ml
spec:
  # replicas: 1 is deliberate. The ML service runs its enrichment /
  # clustering tick on an in-process APScheduler (see ML/main.py); a
  # second replica would fire the same tick twice per interval. Scale-out
  # needs a distributed scheduler lock first.
  replicas: 1
  selector:
    matchLabels:
      app: thermax-ml
  template:
    metadata:
      labels:
        app: thermax-ml
    spec:
      containers:
        - name: ml
          image: thermaxacr.azurecr.io/thermax-ml:latest
          ports:
            - containerPort: 8000
          env:
            - name: PORT
              value: "8000"
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: "/etc/secrets/gee/service-account.json"
          envFrom:
            - secretRef:
                name: thermax-secrets
          volumeMounts:
            - name: gee-credentials
              mountPath: /etc/secrets/gee
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: gee-credentials
          secret:
            secretName: gee-credentials
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: thermax-ml-service
spec:
  type: ClusterIP
  selector:
    app: thermax-ml
  ports:
    - port: 8000
      targetPort: 8000
