name: ThermaX CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install & Verify Backend Syntax
        run: |
          cd Backend
          npm ci
          node --check server.js

      - name: Install & Build Frontend
        run: |
          cd Frontend
          npm ci
          npm run build

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Verify ML Python Modules
        run: |
          cd ML
          python -m py_compile main.py services/quality_control.py services/fusion_service.py
