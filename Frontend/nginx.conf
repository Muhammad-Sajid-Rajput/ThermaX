# ThermaX frontend — SPA fallback.
# Without `try_files`, deep links and page refreshes on client-side routes
# (e.g. /dashboard, /report) return 404 from nginx. Every non-file request
# falls back to index.html so react-router can resolve the route.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Static assets: cache aggressively, never fall back.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Everything else: serve the file if it exists, else the SPA shell.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Security headers (static frontend has no cookies of its own).
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
