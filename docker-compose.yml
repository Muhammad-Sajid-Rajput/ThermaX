version: '3.8'

services:
  backend:
    build: ./Backend
    ports:
      - "5000:5000"
    env_file: ./Backend/.env
    restart: always

  ml:
    build: ./ML
    ports:
      - "8000:8000"
    env_file: ./ML/.env
    restart: always

  frontend:
    build: ./Frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:5000
    restart: always
